<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console de Contrôle - Discord Bot</title>
    <!-- Modern Typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🛡️ Discord Bot Panel</h1>
        
        <!-- Auth view card -->
        <div id="login-container" class="panel-card">
            <h2>Authentification Requise</h2>
            <input type="password" id="password" placeholder="Mot de passe d'administration">
            <button onclick="login()">Se connecter</button>
        </div>
        
        <!-- Dashboard management panel wrapper -->
        <div id="control-panel" style="display: none;">
            
            <div class="panel-card">
                <h2>Gestion de la Banlist</h2>
                <textarea id="banlist" rows="10" placeholder="Une ID d'utilisateur par ligne..."></textarea>
                <button onclick="updateBanlist()">Mettre à jour la Banlist</button>
            </div>

            <div class="panel-card">
                <h2>Actions de Serveur</h2>
                <select id="server-select"></select>
                <div class="button-grid">
                    <button onclick="massBan()" class="btn-secondary">Bannissement de masse</button>
                    <button onclick="exportBans()">Exporter les Bans</button>
                    <button onclick="exportMembers()">Exporter les Membres</button>
                </div>
            </div>

            <div class="panel-card">
                <h2>Messages du Salon</h2>
                <select id="channel-select"></select>
                <button onclick="getMessages()">Récupérer les Messages</button>
                <div id="messages-container"></div>
            </div>

            <div class="panel-card">
                <h2>Logs d'activité</h2>
                <pre id="logs"></pre>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
